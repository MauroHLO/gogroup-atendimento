<rect x="488" y="428" width="208" height="50" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="2"/>
<text x="592" y="452" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">Resumo interno</text>
<text x="592" y="468" font-size="11.5" fill="#52525b" font-weight="400" text-anchor="middle">humano obrigatório</text>
<text x="24" y="500" font-size="12.5" fill="#52525b" font-weight="400" text-anchor="start">Reprovou duas vezes na checagem: texto de reserva, e o nível 0 passa a nível 1.</text>
<text x="24" y="518" font-size="12.5" fill="#52525b" font-weight="400" text-anchor="start">Falha do provedor: nível 2. Nada é executado em sistema real.</text>
<text x="24" y="544" font-size="11.5" fill="#52525b" font-weight="400" text-anchor="start">Fonte: app/src/lib/agent e docs/decisoes.md, seção 14</text>
