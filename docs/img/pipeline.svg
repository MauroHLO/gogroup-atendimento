<text x="128" y="113" font-size="11.5" fill="#52525b" font-weight="400" text-anchor="middle">código</text>
<rect x="256" y="72" width="208" height="52" rx="8" fill="#ffffff" stroke="#1a5da8" stroke-width="2"/>
<text x="360" y="97" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">Classificar</text>
<text x="360" y="113" font-size="11.5" fill="#52525b" font-weight="400" text-anchor="middle">LLM, JSON validado</text>
<rect x="488" y="72" width="208" height="52" rx="8" fill="#ffffff" stroke="#1a5da8" stroke-width="2"/>
<text x="592" y="97" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">Sinais</text>
<text x="592" y="113" font-size="11.5" fill="#52525b" font-weight="400" text-anchor="middle">palavra-chave e LLM</text>
