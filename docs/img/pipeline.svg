<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Pipeline do agente: o LLM entende e redige, o código decide</title>
<desc id="d">Fluxo: mascarar, classificar, sinais, regra de nível. A regra abre três caminhos. Nível 0: redigir, checar, responde ao cliente. Nível 1: redigir, checar, rascunho que uma pessoa aprova. Nível 2: sem redação do LLM, resumo interno e humano obrigatório.</desc>
<rect x="0.5" y="0.5" width="719" height="559" rx="12" fill="#fbfbfa" stroke="#d4d4d8"/>
<text x="24" y="34" font-size="19" fill="#111111" font-weight="600" text-anchor="start">Pipeline do agente: o LLM entende e redige, o código decide</text>
<text x="24" y="56" font-size="13.5" fill="#52525b" font-weight="400" text-anchor="start">Três caminhos saem da regra de nível, cada um na cor do nível.</text>
<rect x="24" y="72" width="208" height="52" rx="8" fill="#ffffff" stroke="#1a5da8" stroke-width="2"/>
