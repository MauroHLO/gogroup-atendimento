<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Impacto em R$: teto, cenários e custo do modelo</title>
<desc id="d">Teto do nível 0: R$ 8.294, estimado, barra sólida. Nível 1: R$ 3.239 a R$ 8.096, hipótese, barra hachurada. Em painel à parte, com escala própria, custo do modelo: R$ 8,49 no caso base (registro) a R$ 24,14 no caso pessimista (hipótese).</desc>
<defs><pattern id="h-cinza" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><rect width="4" height="8" fill="#71717a"/></pattern><pattern id="h-ambar" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><rect width="4" height="8" fill="#eda100"/></pattern><pattern id="h-azul" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><rect width="4" height="8" fill="#2a78d6"/></pattern></defs>
<rect x="0.5" y="0.5" width="719" height="445" rx="12" fill="#fbfbfa" stroke="#d4d4d8"/>
<text x="24" y="34" font-size="19" fill="#111111" font-weight="600" text-anchor="start">Impacto em R$: teto, cenários e custo do modelo</text>
<text x="24" y="56" font-size="13.5" fill="#52525b" font-weight="400" text-anchor="start">Valores no período da amostra. O custo do modelo é minúsculo perto dos outros dois.</text>
